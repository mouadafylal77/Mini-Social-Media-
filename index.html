<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlockFeed - le fil décentralisé</title>
  <style>
    :root {
      --header: #008069;      /* vert d'en-tête */
      --accent: #00a884;      /* vert principal */
      --live: #25d366;        /* vert vif (pastille) */
      --page: #efeae2;        /* fond de conversation */
      --bubble: #ffffff;      /* bulle des autres */
      --bubble-me: #d9fdd3;   /* bulle de l'utilisateur */
      --text: #111b21;
      --muted: #667781;
      --edge: rgba(0, 168, 132, .25);
      --error: #b3261e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--page); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    [hidden] { display: none !important; }

    /* ---------- En-tête ---------- */
    header { background: var(--header); color: #fff; }
    .bar { max-width: 680px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }

    .status-pill { display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px; border-radius: 999px;
      background: rgba(255, 255, 255, .16); font-size: 13px; font-weight: 500; }
    .pulse { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--live); flex: none; }
    .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--live); animation: ring 1.8s ease-out infinite; }
    @keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(3); opacity: 0; } }

    .wrap { max-width: 680px; margin: 0 auto; padding: 18px 14px 70px; }

    /* ---------- Boutons ---------- */
    button { font: inherit; cursor: pointer; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 20px;
      border: 1px solid var(--accent); border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
      transition: background-color .3s ease, border-color .3s ease, color .3s ease, opacity .3s ease; }
    .btn:hover:not(:disabled) { background: var(--header); border-color: var(--header); }
    .btn:disabled { cursor: not-allowed; opacity: .55; }
    /* Transaction en cours : bouton grisé en douceur */
    .btn.loading { background: #8696a0; border-color: #8696a0; opacity: 1; cursor: progress; }
    .btn.outline { background: transparent; color: var(--header); }
    .btn.outline:hover:not(:disabled) { background: var(--header); color: #fff; }
    header .btn { background: #fff; color: var(--header); border-color: #fff; }
    header .btn:hover:not(:disabled) { background: var(--page); border-color: var(--page); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--live); outline-offset: 2px; }

    /* ---------- Formulaire ---------- */
    .composer { background: var(--bubble); border: 1px solid var(--edge); border-radius: 14px; padding: 16px; box-shadow: 0 1px 1px rgba(11, 20, 26, .08); }
    .composer.locked { opacity: .55; pointer-events: none; }
    .as { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 14px; min-height: 26px; }
    .as b { color: var(--text); }
    label { display: block; font-size: 12.5px; font-weight: 600; color: var(--header); margin-bottom: 5px; }
    input[type="text"] { width: 100%; font: inherit; color: var(--text); background: var(--page); border: 1px solid transparent;
      border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; transition: border-color .2s, background-color .2s; }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus { border-color: var(--accent); background: #fff; outline: none; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .small { font-size: 12.5px; color: var(--muted); }
    #status { margin-top: 12px; font-size: 13.5px; min-height: 20px; color: var(--muted); }
    #status.err { color: var(--error); font-weight: 600; }

    .feed-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 2px 12px; }
    .feed-title h2 { margin: 0; font-size: 15px; color: var(--header); }
    .empty { text-align: center; padding: 28px 16px; color: var(--muted); }

    /* ---------- Fil de bulles ---------- */
    .day { display: flex; justify-content: center; margin: 18px 0 12px; }
    .day span { background: #fff; color: var(--muted); font-size: 12.5px; padding: 4px 14px; border-radius: 999px; box-shadow: 0 1px 1px rgba(11, 20, 26, .1); }

    .line { display: flex; margin-bottom: 8px; animation: rise .35s ease-out both; }
    .line.me { justify-content: flex-end; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

    .post { max-width: 88%; padding: 8px 12px 6px; background: var(--bubble); border: 1px solid var(--edge);
      border-radius: 0 12px 12px 12px; box-shadow: 0 1px 1px rgba(11, 20, 26, .08); }
    .line.me .post { background: var(--bubble-me); border-radius: 12px 0 12px 12px; }

    .author { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; font-size: 12.5px; font-weight: 700; color: var(--header); }
    .identicon { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(17, 27, 33, .15); flex: none; }
    .identicon.big { width: 24px; height: 24px; }
    .msg { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .media { display: block; max-width: 100%; max-height: 380px; margin-top: 8px; border-radius: 8px; }
    .stamp { display: block; text-align: right; margin-top: 2px; font-size: 11.5px; color: var(--muted); }

    /* ---------- Attente de validation ---------- */
    .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid rgba(0, 168, 132, .25); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
    .btn .spinner { border-color: rgba(255, 255, 255, .4); border-top-color: #fff; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pending .post { border: 1.5px dashed var(--accent); min-width: 72%; animation: breathe 2s ease-in-out infinite; }
    @keyframes breathe { 50% { border-color: rgba(0, 168, 132, .35); } }
    .pending-title { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--header); }
    .dots { display: inline-flex; gap: 4px; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }

    .track { height: 5px; border-radius: 999px; background: rgba(0, 168, 132, .18); overflow: hidden; margin: 12px 0 8px; }
    .track b { display: block; height: 100%; width: 35%; border-radius: 999px; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

    .pending .msg { color: var(--muted); margin-top: 6px; }
    .steps { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13.5px; }
    .steps li { display: flex; align-items: center; gap: 10px; padding: 3px 0; color: var(--muted); transition: color .3s; }
    .steps li.active, .steps li.done { color: var(--text); }
    .ico { position: relative; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(0, 168, 132, .3); flex: none; }
    li.active .ico { border-color: rgba(0, 168, 132, .3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    li.done .ico { background: var(--accent); border-color: var(--accent); animation: pop .35s ease-out; }
    li.done .ico::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    @keyframes pop { 50% { transform: scale(1.3); } }
    .pending a { color: var(--header); font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      .line, .pending .post, .dots i, .track b, .pulse::after { animation: none; }
      .spinner, li.active .ico { animation-duration: 3s; }
    }
  </style>
</head>
<body>

  <header>
    <div class="bar">
      <div class="brand">BlockFeed</div>
      <div>
        <button id="connectBtn" class="btn">Connecter MetaMask</button>
        <span id="statusPill" class="status-pill" hidden><span class="pulse"></span><span>Connecté à Sepolia</span></span>
      </div>
    </div>
  </header>

  <main class="wrap">

    <!-- Formulaire -->
    <section class="composer locked" id="composer" aria-label="Nouvelle publication">
      <div class="as" id="as">Connectez-vous pour publier.</div>
      <label for="message">Message</label>
      <input id="message" type="text" maxlength="280" placeholder="Écrire un message" autocomplete="off">
      <label for="mediaUrl">Image (URL, optionnel)</label>
      <input id="mediaUrl" type="text" inputmode="url" placeholder="https://exemple.com/image.jpg" autocomplete="off">
      <div class="row">
        <span class="small" id="counter">0 / 280</span>
        <button id="publishBtn" class="btn" disabled>Publier</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <!-- Fil d'actualité -->
    <div class="feed-title">
      <h2>Fil d'actualité</h2>
      <button id="refreshBtn" class="btn outline" disabled>Actualiser</button>
    </div>
    <div id="feed"><div class="empty">Connectez votre portefeuille pour lire les publications.</div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script>
    "use strict";

    // ====== À MODIFIER : adresse du contrat déployé sur Sepolia ======
    const CONTRACT_ADDRESS = "0xVOTRE_ADRESSE_DE_CONTRAT_ICI";
    // ================================================================

    const SEPOLIA_CHAIN_ID = "0xaa36a7";

    const ABI = [
      { "inputs": [{ "internalType": "string", "name": "_message", "type": "string" }, { "internalType": "string", "name": "_mediaUrl", "type": "string" }], "name": "publishPost", "outputs": [], "stateMutability": "nonpayable", "type": "function" },
      { "inputs": [{ "internalType": "uint256", "name": "index", "type": "uint256" }], "name": "getPost", "outputs": [{ "internalType": "string", "name": "", "type": "string" }, { "internalType": "string", "name": "", "type": "string" }, { "internalType": "address", "name": "", "type": "address" }, { "internalType": "uint256", "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" },
      { "inputs": [], "name": "getTotalPosts", "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" }
    ];

    let web3, contract, account = null, busy = false;
    const $ = (id) => document.getElementById(id);

    // Les données de la blockchain passent toujours par textContent (anti-XSS)
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    function setStatus(text, isError) {
      const s = $("status");
      s.textContent = text;
      s.className = isError ? "err" : "";
    }

    /* ---------- Adresses, avatars, dates ---------- */
    const shortAddr = (a) => a.slice(0, 6) + "…" + a.slice(-4);

    // Identicon : cercle uni, couleur = "#" + 6 premiers caractères hexadécimaux de l'adresse
    function identicon(addr, big) {
      const c = el("span", "identicon" + (big ? " big" : ""));
      c.style.background = "#" + addr.slice(2, 8);
      c.setAttribute("aria-hidden", "true");
      return c;
    }

    const fullDate = (d) => d.toLocaleString("fr-FR", {
      day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    const shortTime = (d) => d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    function dayLabel(d) {
      const today = new Date();
      const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
      if (d.toDateString() === today.toDateString()) return "Aujourd'hui";
      if (d.toDateString() === yesterday.toDateString()) return "Hier";
      return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    }

    function errMsg(e) {
      if (e && e.code === 4001) return "Transaction refusée dans MetaMask.";
      const m = (e && e.message) || String(e);
      return m.split("\n")[0].slice(0, 160);
    }

    /* ---------- Connexion MetaMask ---------- */
    async function connect() {
      if (!window.ethereum) { setStatus("MetaMask n'est pas installé.", true); return; }
      if (!Web3.utils.isAddress(CONTRACT_ADDRESS)) { setStatus("Renseignez l'adresse du contrat dans index.html.", true); return; }
      $("connectBtn").disabled = true;
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        const chainId = await window.ethereum.request({ method: "eth_chainId" });
        if (chainId !== SEPOLIA_CHAIN_ID) {
          try {
            await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: SEPOLIA_CHAIN_ID }] });
          } catch (_) { throw new Error("Veuillez passer MetaMask sur le réseau Sepolia."); }
        }
        web3 = new Web3(window.ethereum);
        const code = await web3.eth.getCode(CONTRACT_ADDRESS);
        if (code === "0x" || code === "0x0") throw new Error("Aucun contrat à cette adresse sur Sepolia.");

        contract = new web3.eth.Contract(ABI, CONTRACT_ADDRESS);
        account = accounts[0];

        $("connectBtn").hidden = true;
        $("statusPill").hidden = false;

        const as = $("as");
        as.textContent = "";
        as.append(identicon(account, true), document.createTextNode("Publier en tant que "), el("b", null, shortAddr(account)));

        $("composer").classList.remove("locked");
        $("publishBtn").disabled = false;
        $("refreshBtn").disabled = false;
        setStatus("");
        await loadFeed();
      } catch (e) {
        setStatus(errMsg(e), true);
        $("connectBtn").disabled = false;
      }
    }

    if (window.ethereum) {
      window.ethereum.on("accountsChanged", () => location.reload());
      window.ethereum.on("chainChanged", () => location.reload());
    }

    /* ---------- Bulle "en attente de validation" ---------- */
    function createPending(message) {
      const line = el("div", "line me pending");
      const bubble = el("article", "post");
      line.appendChild(bubble);

      const title = el("div", "pending-title");
      title.append(el("span", "spinner"), el("span", null, "En attente de validation"));
      const dots = el("span", "dots");
      dots.append(el("i"), el("i"), el("i"));
      title.appendChild(dots);
      bubble.appendChild(title);

      const track = el("div", "track");
      track.appendChild(el("b"));
      bubble.appendChild(track);

      bubble.appendChild(el("p", "msg", message));

      const steps = el("ul", "steps");
      const items = ["Signature dans MetaMask", "Inclusion dans un bloc Sepolia"].map((t, i) => {
        const li = el("li", i === 0 ? "active" : "");
        li.append(el("span", "ico"), el("span", null, t));
        steps.appendChild(li);
        return li;
      });
      bubble.appendChild(steps);

      const sentAt = new Date();
      const stamp = el("span", "stamp", "Envoi " + shortTime(sentAt) + " · 0 s");
      stamp.title = fullDate(sentAt);
      bubble.appendChild(stamp);
      const start = Date.now();
      const timer = setInterval(() => {
        stamp.textContent = "Envoi " + shortTime(sentAt) + " · " + Math.floor((Date.now() - start) / 1000) + " s";
      }, 1000);

      return {
        node: line,
        confirming(hash) {           // appelée quand la transaction est signée et envoyée
          items[0].className = "done";
          items[1].className = "active";
          const a = el("a", null, "Voir la transaction sur Etherscan");
          a.href = "https://sepolia.etherscan.io/tx/" + hash;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          const box = el("div", "small");
          box.style.marginTop = "6px";
          box.appendChild(a);
          steps.after(box);
        },
        stop() { clearInterval(timer); line.remove(); }
      };
    }

    /* ---------- Publication ---------- */
    $("message").addEventListener("input", () => {
      $("counter").textContent = $("message").value.length + " / 280";
    });
    $("message").addEventListener("keydown", (e) => { if (e.key === "Enter") publish(); });

    async function publish() {
      const message = $("message").value.trim();
      const mediaUrl = $("mediaUrl").value.trim();
      if (!message) { setStatus("Le message est vide.", true); return; }
      if (mediaUrl && !/^https?:\/\//i.test(mediaUrl)) { setStatus("L'URL de l'image doit commencer par http:// ou https://", true); return; }
      if (busy || !contract) return;

      busy = true;
      const btn = $("publishBtn");
      btn.disabled = true;
      btn.classList.add("loading");
      btn.textContent = "";
      btn.append(el("span", "spinner"), el("span", null, "Validation en cours"));
      setStatus("Confirmez la transaction dans MetaMask.");

      const pending = createPending(message);
      const feed = $("feed");
      const empty = feed.querySelector(".empty");
      if (empty) empty.remove();
      feed.prepend(pending.node);

      try {
        await new Promise((resolve, reject) => {
          const pe = contract.methods.publishPost(message, mediaUrl).send({ from: account });
          pe.on("transactionHash", (h) => { pending.confirming(h); setStatus("Transaction envoyée, en attente du bloc."); });
          pe.then(resolve, reject);
        });
        $("message").value = "";
        $("mediaUrl").value = "";
        $("counter").textContent = "0 / 280";
        setStatus("Post publié.");
      } catch (e) {
        setStatus("Erreur : " + errMsg(e), true);
      } finally {
        busy = false;
        pending.stop();
        btn.disabled = false;
        btn.classList.remove("loading");
        btn.textContent = "Publier";
        await loadFeed();
      }
    }

    /* ---------- Lecture du fil (du plus récent au plus ancien) ---------- */
    async function loadFeed() {
      const feed = $("feed");
      try {
        const total = Number(await contract.methods.getTotalPosts().call());
        if (total === 0) { feed.replaceChildren(el("div", "empty", "Aucun post pour le moment.")); return; }

        const indexes = [];
        for (let i = total - 1; i >= 0; i--) indexes.push(i);
        const posts = await Promise.all(indexes.map((i) => contract.methods.getPost(i).call()));

        const nodes = [];
        let lastDay = null;
        posts.forEach((p) => {
          const date = new Date(Number(p[3]) * 1000);
          const key = date.toDateString();
          if (key !== lastDay) {                       // séparateur de jour
            const day = el("div", "day");
            day.appendChild(el("span", null, dayLabel(date)));
            nodes.push(day);
            lastDay = key;
          }
          nodes.push(renderPost(p[0], p[1], p[2], date));
        });
        feed.replaceChildren(...nodes);
      } catch (e) {
        feed.replaceChildren(el("div", "empty", "Erreur de lecture : " + errMsg(e)));
      }
    }

    function renderPost(message, mediaUrl, author, date) {
      const mine = account && author.toLowerCase() === account.toLowerCase();
      const line = el("div", "line" + (mine ? " me" : ""));
      const bubble = el("article", "post");
      line.appendChild(bubble);

      const head = el("div", "author");
      head.appendChild(identicon(author));
      const name = el("span", null, mine ? "Vous" : shortAddr(author));
      name.title = author;
      head.appendChild(name);
      bubble.appendChild(head);

      bubble.appendChild(el("p", "msg", message));

      // Image affichée seulement pour une URL http(s) (bloque javascript:, data:, etc.)
      if (/^https?:\/\//i.test(mediaUrl)) {
        const img = el("img", "media");
        img.src = mediaUrl;
        img.alt = "Image du post";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";
        img.addEventListener("error", () => img.remove());
        bubble.appendChild(img);
      }

      // Heure courte en bas à droite ; date complète avec secondes au survol
      const stamp = el("time", "stamp", shortTime(date));
      stamp.dateTime = date.toISOString();
      stamp.title = fullDate(date);
      bubble.appendChild(stamp);

      return line;
    }

    $("connectBtn").addEventListener("click", connect);
    $("publishBtn").addEventListener("click", publish);
    $("refreshBtn").addEventListener("click", () => contract && loadFeed());
  </script>
</body>
</html>
